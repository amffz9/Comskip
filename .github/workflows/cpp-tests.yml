name: C++23 tests
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        gui: ['OFF', 'ON']
        sanitizers: [false]
        include:
          - os: ubuntu-latest
            gui: 'OFF'
            sanitizers: true
    runs-on: ${{ matrix.os }}
    env:
      SDL_VIDEODRIVER: dummy
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1
      BUILD_CONFIGURATION: ${{ matrix.sanitizers && 'Debug' || 'Release' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build prerequisites
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          autoconf autoconf-archive automake libtool nasm
      - name: Set up vcpkg
        shell: bash
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/comskip-vcpkg"
          git -C "$RUNNER_TEMP/comskip-vcpkg" checkout 908da3a305a0a8028d9602ab241b433652b3df69
          if [ "$RUNNER_OS" = Windows ]; then
            "$RUNNER_TEMP/comskip-vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          else
            "$RUNNER_TEMP/comskip-vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          fi
      - name: Build and test
        shell: bash
        run: |
          flags=()
          if [ '${{ matrix.sanitizers }}' = true ]; then
            flags+=("-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer"
                    "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined")
          fi
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE="$RUNNER_TEMP/comskip-vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DCMAKE_BUILD_TYPE="$BUILD_CONFIGURATION" \
            -DCOMSKIP_BUILD_GUI='${{ matrix.gui }}' \
            -DVCPKG_MANIFEST_FEATURES='${{ matrix.gui == 'ON' && 'gui' || '' }}' \
            "${flags[@]}"
          cmake --build build --config "$BUILD_CONFIGURATION" --parallel 2
          ctest --test-dir build -C "$BUILD_CONFIGURATION" --output-on-failure
